services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend-commerce-app
    ports:
      - "8080:8080"
      - "8443:8443"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=${DB_HOST};Port=${DB_PORT};Database=${DB_NAME};User Id=${DB_USER};Password=${DB_PASSWORD};SSL Mode=Require
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "dotnet", "--version"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  postgres_data:
